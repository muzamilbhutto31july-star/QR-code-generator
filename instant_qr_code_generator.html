<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant QR Code Generator</title>
    <!-- Tailwind CSS for modern, responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font for clean typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- QRCode.js via CDN for reliable client-side QR generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen flex items-center justify-center p-4 sm:p-6 transition-colors duration-200">

    <!-- Main Centered Card -->
    <main class="w-full max-w-md bg-white dark:bg-slate-900 rounded-3xl shadow-xl shadow-slate-200/60 dark:shadow-black/40 border border-slate-100 dark:border-slate-800 p-6 sm:p-8">
        
        <!-- Header -->
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-indigo-50 dark:bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 mb-3">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path>
                </svg>
            </div>
            <h1 class="text-xl sm:text-2xl font-bold tracking-tight">QR Code Generator</h1>
            <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Instant live encoding & PNG export</p>
        </div>

        <!-- QR Code Display Stage (Always white background for reliable scanning even in dark mode) -->
        <div class="flex flex-col items-center justify-center bg-slate-50 dark:bg-slate-800/60 rounded-2xl p-6 mb-6 border border-slate-200/70 dark:border-slate-700/70">
            <div class="bg-white p-4 rounded-2xl shadow-sm flex items-center justify-center min-w-[232px] min-h-[232px]">
                <div id="qrcode" class="flex items-center justify-center"></div>
                <div id="empty-state" class="hidden text-center px-4 text-slate-400 text-sm">
                    Enter text or a URL below to generate a QR code
                </div>
            </div>
            <span id="char-count" class="text-xs font-medium text-slate-400 dark:text-slate-500 mt-3">36 characters</span>
        </div>

        <!-- Input Control -->
        <div class="mb-6">
            <div class="flex items-center justify-between mb-2">
                <label for="qr-input" class="block text-sm font-medium text-slate-700 dark:text-slate-300">
                    Link or Text Content
                </label>
                <div class="flex items-center gap-2">
                    <button type="button" id="copy-btn" class="text-xs font-medium text-indigo-600 dark:text-indigo-400 hover:text-indigo-700 dark:hover:text-indigo-300 px-2 py-1 rounded-lg hover:bg-indigo-50 dark:hover:bg-indigo-500/10 transition">
                        Copy text
                    </button>
                    <button type="button" id="clear-btn" class="text-xs font-medium text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 px-2 py-1 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition">
                        Clear
                    </button>
                </div>
            </div>
            <input 
                type="text" 
                id="qr-input" 
                value="ff049a44-253f-4873-9080-8187fdadc22f"
                placeholder="https://example.com or any text..."
                autocomplete="off"
                spellcheck="false"
                class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white text-sm font-mono focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
            />
        </div>

        <!-- Primary Action Button -->
        <button 
            type="button" 
            id="download-btn"
            class="w-full py-3.5 px-5 rounded-xl bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] disabled:opacity-40 disabled:pointer-events-none text-white font-semibold text-sm shadow-md shadow-indigo-600/20 flex items-center justify-center gap-2 transition cursor-pointer"
        >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
            </svg>
            <span>Download PNG</span>
        </button>

        <!-- Non-intrusive status toast -->
        <div id="status-msg" role="status" aria-live="polite" class="mt-3 text-center text-xs font-medium text-emerald-600 dark:text-emerald-400 h-4 opacity-0 transition-opacity duration-200"></div>

    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputEl = document.getElementById('qr-input');
            const qrContainer = document.getElementById('qrcode');
            const emptyState = document.getElementById('empty-state');
            const downloadBtn = document.getElementById('download-btn');
            const clearBtn = document.getElementById('clear-btn');
            const copyBtn = document.getElementById('copy-btn');
            const charCountEl = document.getElementById('char-count');
            const statusMsgEl = document.getElementById('status-msg');

            let statusTimeout = null;

            /**
             * Displays a subtle status message below the download button.
             */
            function showStatus(text, isError = false) {
                clearTimeout(statusTimeout);
                statusMsgEl.textContent = text;
                statusMsgEl.className = `mt-3 text-center text-xs font-medium h-4 transition-opacity duration-200 opacity-100 ${
                    isError ? 'text-rose-600 dark:text-rose-400' : 'text-emerald-600 dark:text-emerald-400'
                }`;
                statusTimeout = setTimeout(() => {
                    statusMsgEl.classList.replace('opacity-100', 'opacity-0');
                }, 2500);
            }

            /**
             * Clears and regenerates the QR code based on the current input value.
             */
            function generateQR(text) {
                const value = text.trim();
                charCountEl.textContent = `${text.length} character${text.length === 1 ? '' : 's'}`;
                qrContainer.innerHTML = '';

                if (!value) {
                    qrContainer.classList.add('hidden');
                    emptyState.classList.remove('hidden');
                    downloadBtn.disabled = true;
                    return;
                }

                qrContainer.classList.remove('hidden');
                emptyState.classList.add('hidden');
                downloadBtn.disabled = false;

                try {
                    new QRCode(qrContainer, {
                        text: value,
                        width: 200,
                        height: 200,
                        colorDark: "#0f172a",
                        colorLight: "#ffffff",
                        correctLevel: QRCode.CorrectLevel.H
                    });
                } catch (err) {
                    qrContainer.classList.add('hidden');
                    emptyState.textContent = 'Text is too long to encode into a QR code.';
                    emptyState.classList.remove('hidden');
                    downloadBtn.disabled = true;
                }
            }

            /**
             * Exports the generated QR code with a clean white quiet-zone border as a PNG file.
             */
            function downloadQRAsPNG() {
                const value = inputEl.value.trim();
                if (!value) return;

                try {
                    const sourceCanvas = qrContainer.querySelector('canvas');
                    const sourceImg = qrContainer.querySelector('img');

                    // Create a padded export canvas so scanners always have a clean white quiet zone
                    const padding = 24;
                    const size = 200;
                    const exportCanvas = document.createElement('canvas');
                    exportCanvas.width = size + padding * 2;
                    exportCanvas.height = size + padding * 2;

                    const ctx = exportCanvas.getContext('2d');
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);

                    if (sourceCanvas) {
                        ctx.drawImage(sourceCanvas, padding, padding, size, size);
                    } else if (sourceImg && sourceImg.src) {
                        ctx.drawImage(sourceImg, padding, padding, size, size);
                    } else {
                        showStatus('Unable to export QR image.', true);
                        return;
                    }

                    const dataUrl = exportCanvas.toDataURL('image/png');
                    const link = document.createElement('a');
                    const safeSlug = value.replace(/[^a-z0-9-_]/gi, '_').slice(0, 32) || 'qrcode';
                    link.download = `qr-${safeSlug}.png`;
                    link.href = dataUrl;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);

                    showStatus('PNG downloaded!');
                } catch (err) {
                    showStatus('Download failed. Please try again.', true);
                }
            }

            // Live regeneration on input
            inputEl.addEventListener('input', (e) => {
                emptyState.textContent = 'Enter text or a URL below to generate a QR code';
                generateQR(e.target.value);
            });

            // Download button click
            downloadBtn.addEventListener('click', downloadQRAsPNG);

            // Clear button click
            clearBtn.addEventListener('click', () => {
                inputEl.value = '';
                inputEl.focus();
                generateQR('');
            });

            // Copy text button click (using execCommand fallback for reliable iFrame support)
            copyBtn.addEventListener('click', () => {
                if (!inputEl.value) return;
                inputEl.select();
                inputEl.setSelectionRange(0, 99999);
                try {
                    document.execCommand('copy');
                    showStatus('Copied text to clipboard!');
                } catch (err) {
                    showStatus('Could not copy text.', true);
                }
            });

            // Immediately generate QR code on initial load
            generateQR(inputEl.value);
        });
    </script>
</body>
</html>
